<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inicio de Sesion</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="login-wrapper">
    <section class="login-card" aria-labelledby="login-title">
      <h1 id="login-title">Iniciar sesion</h1>
      <p class="login-subtitle">Base inicial para autenticacion</p>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Correo</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="usuario@correo.com"
            required
          />
        </div>

        <div class="field">
          <label for="password">Contrasena</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="********"
            minlength="6"
            required
          />
        </div>

        <button type="submit" class="btn-primary">Entrar</button>
        <p id="loginMessage" class="login-message" role="status" aria-live="polite"></p>
      </form>

      <small class="hint">
        Credenciales de prueba: <strong>demo@equipo.com</strong> / <strong>123456</strong>
      </small>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
